<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>政策案例｜國際在宅醫療與照護 AI 研究報告</title>
<meta name="description" content="AHMCI 政策案例：英格蘭、法國、丹麥、瑞典、義大利、澳洲、日本、沙烏地阿拉伯的在宅醫療分層負責制度，以及多智能體 AI 在照護上的應用研究。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf8;--ink:#1f2a33;--mute:#5d6873;--line:#ece6da;--teal:#0f766e;--teal2:#e3f4f1;--sun:#f4b740;--coral:#ef6f5c;--sky:#4f8ad9;--violet:#7c5cd6}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC",serif;line-height:1.25;margin:0;text-wrap:balance}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}

/* hero */
.hero{position:relative;padding:clamp(36px,6vw,76px) 0 clamp(28px,4vw,48px);background:radial-gradient(circle at 12% 20%,#fff1cf 0,transparent 38%),radial-gradient(circle at 88% 10%,#dff3ef 0,transparent 40%),radial-gradient(circle at 70% 95%,#fde4df 0,transparent 35%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.brand{display:inline-block;margin-bottom:18px}
.brand img{display:block;height:clamp(52px,6vw,68px);width:auto}
.kicker{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:14px;font-weight:700;color:var(--teal)}
h1{font-size:clamp(30px,4.8vw,50px);font-weight:900;margin:14px 0 12px}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,#ffe08a 62%)}
.sub{font-size:18px;color:var(--mute);max-width:36em;margin:0}
.nums{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.num{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.num b{display:block;font:900 28px/1.1 "Noto Serif TC",serif;color:var(--teal)}
.num span{font-size:13.5px;color:var(--mute)}
.art svg{width:100%;height:auto;display:block}
.float{animation:bob 4s ease-in-out infinite}
.float.d2{animation-delay:-1.3s}.float.d3{animation-delay:-2.6s}
@keyframes bob{50%{transform:translateY(-7px)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.art{max-width:420px}}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:rgba(255,253,248,.94);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.chip{font:inherit;font-size:15px;min-height:42px;padding:6px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.search{margin-left:auto;flex:1 1 220px;max-width:300px;font:inherit;font-size:15px;min-height:42px;padding:6px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff}
.chip:focus-visible,.search:focus-visible,.card:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(max-width:600px){.search{max-width:none;margin-left:0}}

/* sections */
section{padding:clamp(30px,4vw,52px) 0}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h2{font-size:clamp(23px,3vw,32px);font-weight:900}
.count{font-size:14px;color:var(--mute)}
.sec-p{color:var(--mute);margin:0 0 20px;max-width:46em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

/* cards */
.card{--c:var(--teal);position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;text-decoration:none;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--stripe,var(--c))}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 28px -16px rgba(31,42,51,.35);border-color:var(--c)}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.badge{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font:900 17px/1 "Noto Serif TC",serif}
.badge svg{width:30px;height:30px}
.place{font-size:13.5px;font-weight:700;color:var(--c)}
.card h3{font-size:18.5px;font-weight:700;color:var(--ink)}
.card p{font-size:14.8px;color:var(--mute);margin:10px 0 14px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12.5px;padding:2px 9px;border-radius:99px;background:#f6f2ea;color:#4d5862}
.go{position:absolute;right:16px;bottom:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:18px;opacity:0;transform:translateX(-6px);transition:.25s}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.card.hide{display:none}
.empty{display:none;color:var(--mute);padding:20px 0}

.ai{background:linear-gradient(180deg,#f4f1ff 0,var(--bg) 100%)}
.tip{margin:0 0 40px;background:#fff;border:1px dashed #d8cfbd;border-radius:14px;padding:14px 18px;font-size:15px;color:var(--mute)}
.tip b{color:var(--ink)}
footer .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
footer img{height:34px;width:auto}
footer{border-top:1px solid var(--line);padding:22px 0 30px;font-size:13.5px;color:var(--mute)}
</style>
</head>
<body>

<header class="hero">
 <div class="wrap">
  <div>
   <a class="brand" id="brand"><img id="logo" alt=""></a><br>
   <span class="kicker" id="kicker"></span>
   <h1 id="title"></h1>
   <p class="sub" id="subtitle"></p>
   <div class="nums" id="nums"></div>
  </div>
  <div class="art" aria-hidden="true">
   <svg viewBox="0 0 420 300">
    <ellipse cx="210" cy="272" rx="180" ry="16" fill="#efe7d8"/>
    <path d="M120 150 L210 82 L300 150Z" fill="#ef6f5c"/>
    <rect x="132" y="148" width="156" height="118" rx="6" fill="#fff" stroke="#e3d9c7" stroke-width="2"/>
    <rect x="152" y="172" width="46" height="38" rx="4" fill="#e3f4f1" stroke="#0f766e" stroke-width="2"/>
    <path d="M175 172v38M152 191h46" stroke="#0f766e" stroke-width="2"/>
    <rect x="222" y="196" width="40" height="70" rx="4" fill="#0f766e"/>
    <rect x="198" y="114" width="24" height="24" rx="4" fill="#fff"/><path d="M210 118v16M202 126h16" stroke="#ef6f5c" stroke-width="4" stroke-linecap="round"/>
    <g class="float"><circle cx="70" cy="90" r="34" fill="#fff" stroke="#4f8ad9" stroke-width="2.5"/><path d="M52 92h10l6-14 8 26 6-12h12" fill="none" stroke="#4f8ad9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="float d2"><circle cx="352" cy="82" r="32" fill="#fff" stroke="#7c5cd6" stroke-width="2.5"/><circle cx="342" cy="78" r="5" fill="#7c5cd6"/><circle cx="362" cy="78" r="5" fill="#7c5cd6"/><path d="M340 92q12 9 24 0" fill="none" stroke="#7c5cd6" stroke-width="3" stroke-linecap="round"/><path d="M352 50v-10" stroke="#7c5cd6" stroke-width="3" stroke-linecap="round"/><circle cx="352" cy="37" r="4" fill="#f4b740"/></g>
    <g class="float d3"><circle cx="360" cy="196" r="26" fill="#fff" stroke="#f4b740" stroke-width="2.5"/><path d="M350 196l7 7 13-14" fill="none" stroke="#f4b740" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path d="M100 112 C120 130 130 150 150 160" fill="none" stroke="#4f8ad9" stroke-width="2.5" stroke-dasharray="5 6"/>
    <path d="M322 104 C300 120 292 140 278 156" fill="none" stroke="#7c5cd6" stroke-width="2.5" stroke-dasharray="5 6"/>
    <path d="M336 204 C320 214 306 220 290 222" fill="none" stroke="#f4b740" stroke-width="2.5" stroke-dasharray="5 6"/>
   </svg>
  </div>
 </div>
</header>

<div class="bar"><div class="wrap" role="toolbar" aria-label="篩選報告" id="toolbar">
 <input class="search" type="search" id="q">
</div></div>

<main>
<div class="wrap"><p class="empty" id="empty">找不到符合的報告，換個關鍵字試試。</p></div>
<div id="sections"></div>
<div class="wrap"><div class="tip" id="tip"></div></div>
</main>

<footer><div class="wrap"><img id="flogo" alt=""><span id="footer"></span></div></footer>

<script src="config.js"></script>
<script>
{
const C=window.SITE_CONFIG,S=C.site,$=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={
 chat:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h14v9H10l-4 4v-4H4z"/><path d="M28 13H18v8h4l4 4v-4h2z"/></svg>',
 pulse:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h6l3-7 5 14 3-7h7"/></svg>',
 graph:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="12" width="10" height="8" rx="2"/><path d="M4 6l7 7M4 26l7-7M28 16h-7"/></svg>'
};
// header & footer
$('brand').href=S.homeUrl;
for(const id of ['logo','flogo']){$(id).src=S.logo}
$('logo').alt=S.logoAlt;
$('kicker').textContent=S.kicker;
$('title').innerHTML=esc(S.titleA)+'<br><em>'+esc(S.titleB)+'</em>？';
$('subtitle').textContent=S.subtitle;
$('tip').innerHTML=S.tip;$('tip').hidden=!S.tip;
$('footer').textContent=S.footer;
$('q').placeholder=S.searchPlaceholder;$('q').setAttribute('aria-label','搜尋報告');
// stats
const byCat=id=>C.reports.filter(r=>r.category===id);
$('nums').innerHTML=C.categories.map(c=>`<div class="num"><b>${byCat(c.id).length}</b><span>${esc(c.statLabel||c.label)}</span></div>`).join('')+`<div class="num"><b>${C.reports.length}</b><span>份完整報告</span></div>`;
// filter chips
const chipHtml=[{id:'all',label:'全部'},...C.categories].map((c,i)=>`<button class="chip" data-f="${esc(c.id)}" aria-pressed="${i===0}">${esc(c.label)}</button>`).join('');
$('toolbar').insertAdjacentHTML('afterbegin',chipHtml);
// sections & cards
const card=r=>`<a class="card" data-cat="${esc(r.category)}" href="reports/${encodeURI(r.file)}" style="--c:${esc(r.color)}${r.stripe?';--stripe:'+esc(r.stripe):''}">
 <div class="top"><div class="badge">${r.icon&&ICONS[r.icon]?ICONS[r.icon]:esc(r.badge||'')}</div><div><div class="place">${esc(r.place)}</div><h3>${esc(r.title)}</h3></div></div>
 <p>${esc(r.summary)}</p>
 <div class="tags">${(r.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><span class="go">→</span></a>`;
$('sections').innerHTML=C.categories.map(c=>`<section id="${esc(c.id)}" data-sec="${esc(c.id)}"${c.tinted?' class="ai"':''}><div class="wrap">
 <div class="sec-h"><h2>${esc(c.heading)}</h2><span class="count">${byCat(c.id).length} 份</span></div>
 <p class="sec-p">${esc(c.intro)}</p>
 <div class="grid">${byCat(c.id).map(card).join('')}</div></div></section>`).join('');
// filtering
const chips=[...document.querySelectorAll('.chip')],cards=[...document.querySelectorAll('.card')],secs=[...document.querySelectorAll('[data-sec]')],q=$('q'),empty=$('empty');
let f='all';
function apply(){
  const k=q.value.trim().toLowerCase();let shown=0;
  cards.forEach(c=>{const ok=(f==='all'||c.dataset.cat===f)&&(!k||c.textContent.toLowerCase().includes(k));c.classList.toggle('hide',!ok);if(ok)shown++});
  secs.forEach(s=>{s.hidden=!s.querySelector('.card:not(.hide)')});
  empty.style.display=shown?'none':'block';
}
chips.forEach(b=>b.addEventListener('click',()=>{f=b.dataset.f;chips.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));apply()}));
q.addEventListener('input',apply);
}
</script>
</body>
</html>
