<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影音專區｜健康樂活與智慧醫療照護聯盟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFBF3;
    --ink:#20303F;
    --ink-soft:#4B5C6B;
    --coral:#FF6B54;
    --coral-dark:#E14E3A;
    --teal:#0E9594;
    --teal-dark:#0B7473;
    --gold:#FFC94A;
    --card:#FFFFFF;
    --ring:rgba(32,48,63,.08);
    --shadow-coral:0 14px 30px -12px rgba(255,107,84,.45);
    --shadow-teal:0 14px 30px -12px rgba(14,149,148,.45);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Noto Serif TC',serif;
    margin:0;
    letter-spacing:.01em;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}

  /* ---------- 回上一頁 ---------- */
  .back-bar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,251,243,.9);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--ring);
  }
  .back-bar-inner{
    max-width:1080px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:2px solid var(--ink);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:9px 18px 9px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .back-btn:hover{
    background:var(--ink);
    color:#fff;
    transform:translateX(-3px);
  }
  .back-btn svg{width:18px;height:18px;flex:none;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    padding:64px 24px 84px;
  }
  .hero-blob{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.55;
  }
  .blob-1{width:260px;height:260px;background:var(--coral);top:-90px;right:-60px;opacity:.35;}
  .blob-2{width:180px;height:180px;background:var(--teal);bottom:-60px;right:180px;opacity:.3;}
  .blob-3{width:110px;height:110px;background:var(--gold);top:40px;right:280px;opacity:.6;}
  .hero-inner{
    position:relative;
    max-width:900px;
    margin:0 auto;
    text-align:center;
  }
  .hero-eyebrow{
    display:inline-block;
    background:var(--teal);
    color:#fff;
    font-weight:700;
    font-size:14px;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(32px,5.5vw,54px);
    font-weight:900;
    color:var(--ink);
    line-height:1.3;
  }
  .hero h1 span{color:var(--coral);}
  .hero p{
    margin:20px auto 0;
    max-width:560px;
    font-size:18px;
    color:var(--ink-soft);
  }
  .hero-nav{
    margin-top:34px;
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .hero-nav a{
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    padding:11px 22px;
    border-radius:999px;
    border:2px solid var(--ink);
    transition:transform .15s ease;
  }
  .hero-nav a:hover{transform:translateY(-2px);}
  .hero-nav a.n1{background:var(--coral);border-color:var(--coral);color:#fff;}
  .hero-nav a.n2{background:var(--teal);border-color:var(--teal);color:#fff;}

  /* ---------- Section shell ---------- */
  section.group{padding:70px 24px;}
  .group-inner{max-width:1080px;margin:0 auto;}
  .group-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:38px;
  }
  .group-head h2{
    font-size:clamp(26px,3.4vw,36px);
    font-weight:700;
  }
  .group-head p{
    margin:8px 0 0;
    color:var(--ink-soft);
    font-size:16px;
    max-width:480px;
  }
  .tag-pill{
    font-weight:700;
    font-size:14px;
    padding:6px 14px;
    border-radius:999px;
    white-space:nowrap;
  }

  .films{background:linear-gradient(180deg,#FFF3EC 0%, var(--bg) 100%);}
  .films .tag-pill{background:var(--coral);color:#fff;}
  .news .tag-pill{background:var(--teal);color:#fff;}

  /* ---------- Cards ---------- */
  .grid{
    display:grid;
    gap:26px;
    grid-template-columns:repeat(2,1fr);
  }
  .grid.news-grid{grid-template-columns:repeat(3,1fr);}

  .card{
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--ring);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .films .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-coral);}
  .news .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-teal);}

  .thumb-wrap{
    position:relative;
    aspect-ratio:16/9;
    background:#0d1117;
    cursor:pointer;
    overflow:hidden;
  }
  .thumb-wrap img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .35s ease;
  }
  .thumb-wrap:hover img{transform:scale(1.06);}
  .thumb-wrap iframe{width:100%;height:100%;border:0;position:absolute;inset:0;}

  .play-btn{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play-circle{
    width:62px;height:62px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    transition:transform .15s ease;
  }
  .thumb-wrap:hover .play-circle{transform:scale(1.08);}
  .films .play-circle{background:var(--coral);}
  .news .play-circle{background:var(--teal);}
  .play-circle svg{width:22px;height:22px;fill:#fff;margin-left:3px;}

  .card-body{padding:20px 22px 24px;}
  .films .card-body h3{font-size:21px;font-weight:700;color:var(--coral-dark);}
  .news .card-body h3{font-size:17px;font-weight:700;color:var(--teal-dark);}
  .card-body p{
    margin:8px 0 0;
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ---------- Footer ---------- */
  footer{
    background:var(--ink);
    color:#EDEFF2;
    padding:44px 24px 34px;
    text-align:center;
  }
  footer .back-btn{
    background:transparent;
    border-color:#EDEFF2;
    color:#EDEFF2;
  }
  footer .back-btn:hover{background:#EDEFF2;color:var(--ink);}
  footer p{
    margin:22px 0 0;
    font-size:13px;
    color:#9FB0BE;
  }

  @media (max-width:760px){
    .grid, .grid.news-grid{grid-template-columns:1fr;}
    .hero{padding:52px 20px 64px;}
    section.group{padding:52px 20px;}
  }
</style>
</head>
<body>

<div class="back-bar">
  <div class="back-bar-inner">
    <button class="back-btn" onclick="goBack()" aria-label="回上一頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      回上一頁
    </button>
  </div>
</div>

<header class="hero">
  <div class="hero-blob blob-1"></div>
  <div class="hero-blob blob-2"></div>
  <div class="hero-blob blob-3"></div>
  <div class="hero-inner">
    <span class="hero-eyebrow">影音專區</span>
    <h1>看見<span>銀髮生活</span>裡的<br>溫度與科技</h1>
    <p>健康樂活與智慧醫療照護聯盟與工研院銀髮聚寶盆實驗場域精選微電影與新聞報導，一起看見高齡照護的日常故事，與智慧科技如何陪伴每一個家庭。</p>
    <div class="hero-nav">
      <a class="n1" href="#films">觀看微電影</a>
      <a class="n2" href="#news">觀看新聞影片</a>
    </div>
  </div>
</header>

<section class="group films" id="films">
  <div class="group-inner">
    <div class="group-head">
      <div>
        <h2>微電影</h2>
        <p>四則短片，訴說銀髮賦能、家庭羈絆與智慧陪伴的真實情感。</p>
      </div>
      <span class="tag-pill">共 4 部</span>
    </div>
    <div class="grid" id="films-grid"></div>
  </div>
</section>

<section class="group news" id="news">
  <div class="group-inner">
    <div class="group-head">
      <div>
        <h2>新聞影片</h2>
        <p>媒體報導聯盟相關議題與智慧醫療照護的最新動態。</p>
      </div>
      <span class="tag-pill">共 6 則</span>
    </div>
    <div class="grid news-grid" id="news-grid"></div>
  </div>
</section>

<footer>
  <button class="back-btn" onclick="goBack()" aria-label="回上一頁">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    回上一頁
  </button>
  <p>健康樂活與智慧醫療照護聯盟</p>
</footer>

<script>
  function goBack(){
    if (document.referrer) {
      history.back();
    } else {
      history.back();
    }
  }

  const films = [
    { id:"ozCVyi1tMBM", title:"銀髮賦能篇", desc:"看見高齡者重拾自信與活力的故事。" },
    { id:"TrmarhH73pQ", title:"爺爺的夢想", desc:"一段關於陪伴與圓夢的祖孫情。" },
    { id:"cCmCJ9VXloM", title:"捉迷藏", desc:"日常小事裡，藏著最深的牽掛。" },
    { id:"X04Pm8SLX3k", title:"陪伴機器人", desc:"當科技走進生活，陪伴不再受限於距離。" }
  ];

  const news = [
    { id:"wj2MviAXVW4", title:"新聞報導一" },
    { id:"3eKB7OUCNUA", title:"新聞報導二" },
    { id:"DzLuKNFcB6c", title:"新聞報導三" },
    { id:"z6Df-tR7JKs", title:"新聞報導四" },
    { id:"7XmcfAV9Rd4", title:"新聞報導五" },
    { id:"EaLQS-xLN4U", title:"新聞報導六" }
  ];

  function playIcon(){
    return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  }

  function buildCard(v, withDesc){
    const card = document.createElement('div');
    card.className = 'card';

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';
    thumbWrap.innerHTML = `
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.title}" loading="lazy">
      <div class="play-btn"><div class="play-circle">${playIcon()}</div></div>
    `;
    thumbWrap.addEventListener('click', () => {
      thumbWrap.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0" title="${v.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }, { once:true });

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `<h3>${v.title}</h3>${withDesc ? `<p>${v.desc}</p>` : `<p>點擊觀看完整報導</p>`}`;

    card.appendChild(thumbWrap);
    card.appendChild(body);
    return card;
  }

  const filmsGrid = document.getElementById('films-grid');
  films.forEach(v => filmsGrid.appendChild(buildCard(v, true)));

  const newsGrid = document.getElementById('news-grid');
  news.forEach(v => newsGrid.appendChild(buildCard(v, false)));
</script>

</body>
</html>
