<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新活動規劃中｜健康樂活與智慧醫療照護聯盟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFBF3;
    --ink:#20303F;
    --ink-soft:#4B5C6B;
    --coral:#FF6B54;
    --coral-dark:#E14E3A;
    --teal:#0E9594;
    --teal-dark:#0B7473;
    --gold:#FFC94A;
    --card:#FFFFFF;
    --ring:rgba(32,48,63,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }
  h1{font-family:'Noto Serif TC',serif;margin:0;}

  /* ---------- 回上一頁 ---------- */
  .back-bar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,251,243,.9);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--ring);
  }
  .back-bar-inner{
    max-width:1080px;
    margin:0 auto;
    padding:14px 24px;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:2px solid var(--ink);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:9px 18px 9px 14px;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .back-btn:hover{
    background:var(--ink);
    color:#fff;
    transform:translateX(-3px);
  }
  .back-btn svg{width:18px;height:18px;flex:none;}

  /* ---------- Main ---------- */
  main{
    flex:1;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px 64px;
    text-align:center;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(1px);
  }
  .b1{width:280px;height:280px;background:var(--coral);opacity:.28;top:-100px;left:-80px;}
  .b2{width:220px;height:220px;background:var(--teal);opacity:.26;bottom:-90px;right:-70px;}
  .b3{width:120px;height:120px;background:var(--gold);opacity:.5;top:60px;right:8%;}
  .b4{width:70px;height:70px;background:var(--teal);opacity:.35;bottom:18%;left:10%;}

  .stage{
    position:relative;
    max-width:600px;
  }

  .eyebrow{
    display:inline-block;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:26px;
  }

  .rig{
    position:relative;
    width:220px;
    height:220px;
    margin:0 auto 8px;
  }
  .cone{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    animation:bob 2.6s ease-in-out infinite;
  }
  .gear{
    position:absolute;
    top:6px;
    right:6px;
    transform-origin:center;
    animation:spin 7s linear infinite;
  }
  .gear.small{
    top:36px;
    right:56px;
    width:34px;
    animation:spin 5s linear infinite reverse;
  }
  .spark{
    position:absolute;
    animation:twinkle 1.8s ease-in-out infinite;
  }
  .spark.s1{top:10px;left:6px;animation-delay:.1s;}
  .spark.s2{bottom:30px;left:20px;animation-delay:.6s;}
  .spark.s3{top:60px;left:-4px;animation-delay:1.1s;}

  @keyframes bob{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-8px);}
  }
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes twinkle{
    0%,100%{opacity:.3;transform:scale(.8);}
    50%{opacity:1;transform:scale(1.15);}
  }

  h1{
    font-size:clamp(30px,5vw,46px);
    font-weight:900;
    margin-top:10px;
  }
  h1 span{color:var(--coral);}
  .sub{
    margin:18px auto 0;
    max-width:440px;
    font-size:18px;
    color:var(--ink-soft);
  }

  .progress-wrap{
    margin:34px auto 0;
    max-width:360px;
    text-align:left;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .progress-track{
    height:14px;
    border-radius:999px;
    background:#EFE7DA;
    overflow:hidden;
    border:1px solid var(--ring);
  }
  .progress-fill{
    height:100%;
    width:38%;
    border-radius:999px;
    background:repeating-linear-gradient(
      135deg,
      var(--coral) 0 14px,
      var(--gold) 14px 28px
    );
    background-size:200% 100%;
    animation:stripes 1.8s linear infinite;
  }
  @keyframes stripes{
    from{background-position:0 0;}
    to{background-position:56px 0;}
  }

  .badges{
    margin-top:32px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .badge{
    font-size:14px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    background:var(--card);
    border:2px solid var(--ring);
    color:var(--ink-soft);
  }
  .badge.on{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }

  footer{
    background:var(--ink);
    color:#EDEFF2;
    padding:30px 24px;
    text-align:center;
  }
  footer .back-btn{
    background:transparent;
    border-color:#EDEFF2;
    color:#EDEFF2;
  }
  footer .back-btn:hover{background:#EDEFF2;color:var(--ink);}
  footer p{
    margin:18px 0 0;
    font-size:13px;
    color:#9FB0BE;
  }
</style>
</head>
<body>

<div class="back-bar">
  <div class="back-bar-inner">
    <button class="back-btn" id="backBtnTop" aria-label="回上一頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      回上一頁
    </button>
  </div>
</div>

<main>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <div class="stage">
    <span class="eyebrow">COMING SOON</span>

    <div class="rig" aria-hidden="true">
      <svg class="spark s1" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2v6M12 16v6M2 12h6M16 12h6" stroke="#FFC94A" stroke-width="3" stroke-linecap="round"/></svg>
      <svg class="spark s2" width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M12 2v6M12 16v6M2 12h6M16 12h6" stroke="#FF6B54" stroke-width="3" stroke-linecap="round"/></svg>
      <svg class="spark s3" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2v6M12 16v6M2 12h6M16 12h6" stroke="#0E9594" stroke-width="3" stroke-linecap="round"/></svg>

      <svg class="gear" width="56" height="56" viewBox="0 0 24 24" fill="#0E9594">
        <path d="M19.14 12.94a7.14 7.14 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.2 7.2 0 00-1.63-.95l-.36-2.54a.5.5 0 00-.5-.43h-3.84a.5.5 0 00-.5.43l-.36 2.54c-.59.24-1.14.56-1.63.95l-2.39-.96a.5.5 0 00-.6.22L2.71 8.84a.5.5 0 00.12.64l2.03 1.58a7.14 7.14 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.39 1.04.71 1.63.95l.36 2.54c.05.25.26.43.5.43h3.84c.24 0 .45-.18.5-.43l.36-2.54c.59-.24 1.14-.56 1.63-.95l2.39.96c.24.1.46 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
      </svg>
      <svg class="gear small" width="34" height="34" viewBox="0 0 24 24" fill="#FFC94A">
        <path d="M19.14 12.94a7.14 7.14 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.2 7.2 0 00-1.63-.95l-.36-2.54a.5.5 0 00-.5-.43h-3.84a.5.5 0 00-.5.43l-.36 2.54c-.59.24-1.14.56-1.63.95l-2.39-.96a.5.5 0 00-.6.22L2.71 8.84a.5.5 0 00.12.64l2.03 1.58a7.14 7.14 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.39 1.04.71 1.63.95l.36 2.54c.05.25.26.43.5.43h3.84c.24 0 .45-.18.5-.43l.36-2.54c.59-.24 1.14-.56 1.63-.95l2.39.96c.24.1.46 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
      </svg>

      <svg class="cone" width="120" height="150" viewBox="0 0 120 150" fill="none">
        <ellipse cx="60" cy="140" rx="52" ry="10" fill="#20303F" opacity=".12"/>
        <rect x="18" y="112" width="84" height="20" rx="4" fill="#E14E3A"/>
        <rect x="18" y="112" width="84" height="20" rx="4" fill="url(#stripe)"/>
        <path d="M46 106 L54 20 a6 6 0 0112 0 L74 106 Z" fill="#FF6B54"/>
        <path d="M50 82 h20 v10 h-20 z" fill="#FFFBF3"/>
        <path d="M53 56 h14 v9 h-14 z" fill="#FFFBF3"/>
        <circle cx="60" cy="18" r="7" fill="#FFC94A"/>
        <defs>
          <pattern id="stripe" width="16" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
            <rect width="8" height="20" fill="#FFFBF3"/>
          </pattern>
        </defs>
      </svg>
    </div>

    <h1>新活動<span>規劃中</span></h1>
    <p class="sub">我們正在為大家籌備新的精彩內容，<br>尚未公告上架，請耐心期待！</p>

    <div class="progress-wrap">
      <div class="progress-label"><span>籌備進度</span><span>施工中</span></div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>

    <div class="badges">
      <span class="badge on">活動規劃中</span>
      <span class="badge">內容製作</span>
      <span class="badge">正式上架</span>
    </div>
  </div>
</main>

<footer>
  <button class="back-btn" id="backBtnBottom" aria-label="回上一頁">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    回上一頁
  </button>
  <p>健康樂活與智慧醫療照護聯盟</p>
</footer>

<script>
  // 有瀏覽紀錄就返回上一頁；若是直接開啟此頁（無上一頁紀錄），
  // 目前先退回瀏覽器預設行為，待確認主頁相對路徑後可補上固定保底連結。
  function goBack(){ history.back(); }
  document.getElementById('backBtnTop').addEventListener('click', goBack);
  document.getElementById('backBtnBottom').addEventListener('click', goBack);
</script>

</body>
</html>
